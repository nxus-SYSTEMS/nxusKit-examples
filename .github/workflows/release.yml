# CD — Create a tagged release matching the SDK version after explicit approval.
#
# Reads the SDK version from the latest nxusKit SDK GitHub Release tag
# (sdk-vX.Y.Z) and creates a GitHub Release with auto-generated source
# archives (.tar.gz, .zip).
#
# Skips if the tag already exists (idempotent on re-runs / unchanged version).
# Manual dispatchers must type CONFIRM_RELEASE and select the main ref.

name: Release

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: Type CONFIRM_RELEASE to create a public Examples Release from main.
        required: true
        type: string

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate manual release gate
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirm_release }}
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_CONFIRMATION" != "CONFIRM_RELEASE" ]]; then
            echo "Explicit confirmation is required." >&2
            exit 1
          fi
          if [[ "$SELECTED_REF" != "refs/heads/main" ]]; then
            echo "Release dispatches must select the main ref." >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read SDK version and stats
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SDK_TAG="$(gh release view --repo nxus-SYSTEMS/nxusKit --json tagName --jq .tagName)"
          if [[ "$SDK_TAG" != sdk-v* ]]; then
            echo "Unexpected SDK release tag: $SDK_TAG" >&2
            exit 1
          fi

          # Hybrid tag: SDK version + date (e.g., v0.9.4-20260519)
          # Allows interim examples releases between SDK versions
          SDK_VERSION="${SDK_TAG#sdk-v}"
          TAG="v${SDK_VERSION}-$(date -u +%Y%m%d)"

          EXAMPLES=$(python3 -c "
          import json
          m = json.load(open('conformance/examples_manifest.json'))
          total = len(m['examples'])
          py = sum(1 for e in m['examples'] if 'python' in e.get('languages', []))
          bash = sum(1 for e in m['examples'] if 'bash' in e.get('languages', []))
          print(f'{total} examples ({py} with Python, {bash} with CLI/Bash)')
          ")

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sdk_version=$SDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "examples=$EXAMPLES" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG | SDK: $SDK_VERSION | $EXAMPLES"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          SDK="${{ steps.meta.outputs.sdk_version }}"
          EXAMPLES="${{ steps.meta.outputs.examples }}"

          # Skip if release already exists (idempotent with publish-to-public)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            exit 0
          fi

          gh release create "$TAG" \
            --title "nxusKit Examples $TAG" \
            --notes "$(cat <<EOF
          ## nxusKit Examples $TAG

          $EXAMPLES in Rust, Go, Python, and CLI/Bash — compatible with nxusKit SDK v${SDK}.

          ### Download

          Download the source archive below to get all examples with scenario
          data, conformance manifests, and helper scripts.

          > **Note:** Examples require the [nxusKit SDK](https://github.com/nxus-SYSTEMS/nxusKit)
          > v${SDK}+ to build and run. See the
          > [README](https://github.com/nxus-SYSTEMS/nxusKit-examples#quick-start)
          > for setup instructions.
          EOF
          )" \
            --latest
          echo "Created release $TAG"
