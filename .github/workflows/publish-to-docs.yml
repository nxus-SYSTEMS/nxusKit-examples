# .github/workflows/publish-to-docs.yml
#
# Pushes examples documentation to nxus-docs for public hosting.
# Triggered on push to main (mirrors publish-to-public cadence) or
# workflow_dispatch for manual syncs.
#
# Pushes content to: nxus-docs/src/content/docs/nxuskit/examples/
# Source of truth:   README.md, canonical example READMEs, and
#                    conformance/docs_export_manifest.json companions
#
# Required secrets:
#   NXUS_DOCS_TOKEN  — fine-grained PAT with Contents write access to
#                      nxus-SYSTEMS/nxus-docs, scoped to src/content/docs/nxuskit/examples/

name: Publish to Docs

on:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "conformance/**"
      - "examples/**/*.md"
      - "scripts/verify-docs-export-manifest.mjs"
      - ".github/workflows/publish-to-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Leak gate ────────────────────────────────────────────────
      - name: Leak gate — forbidden terms in doc sources
        run: |
          set -eu -o pipefail
          SCAN_PATHS=()
          for d in examples conformance; do
            [[ -d "$d" ]] && SCAN_PATHS+=("$d")
          done
          for f in README.md; do
            [[ -f "$f" ]] && SCAN_PATHS+=("$f")
          done

          FORBIDDEN_TERMS=(
            "INTERNAL-ONLY"
            "nxusKit-internal"
            "nxusKit-examples-internal"
            "nxusKit-plugins-internal"
          )

          for term in "${FORBIDDEN_TERMS[@]}"; do
            HITS=$(grep -r -n \
                --include='*.md' --include='*.mdx' \
                "$term" "${SCAN_PATHS[@]}" 2>/dev/null || true)
            if [[ -n "$HITS" ]]; then
              echo "$HITS"
              echo "::error::Forbidden term '$term' found in doc sources."
              exit 1
            fi
          done
          echo "Leak gate passed."

      - name: Validate docs export manifest
        run: node scripts/verify-docs-export-manifest.mjs

      # ── Commit message ───────────────────────────────────────────
      - name: Build commit message
        id: commit-msg
        run: |
          set -eu -o pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            SUBJECT=$(git log -1 --format='%s' HEAD)
            echo "msg=docs(nxuskit/examples): sync — ${SUBJECT}" >> "$GITHUB_OUTPUT"
          else
            SUBJECT=$(git log -1 --format='%s' HEAD)
            echo "msg=docs(nxuskit/examples): sync — ${SUBJECT}" >> "$GITHUB_OUTPUT"
          fi

      # ── Push to nxus-docs ────────────────────────────────────────
      - name: Push to nxus-docs
        env:
          NXUS_DOCS_TOKEN: ${{ secrets.NXUS_DOCS_TOKEN }}
          COMMIT_MSG: ${{ steps.commit-msg.outputs.msg }}
        run: |
          set -eu -o pipefail

          if [[ -z "${NXUS_DOCS_TOKEN:-}" ]]; then
            echo "::notice::NXUS_DOCS_TOKEN not configured — skipping push."
            echo "Add a fine-grained PAT with Contents write on nxus-SYSTEMS/nxus-docs."
            exit 0
          fi

          REMOTE_URL="https://x-access-token:${NXUS_DOCS_TOKEN}@github.com/nxus-SYSTEMS/nxus-docs.git"

          git clone --depth=1 "$REMOTE_URL" /tmp/nxus-docs-clone
          cd /tmp/nxus-docs-clone

          # Use the docs site's transform so Starlight frontmatter, route
          # generation, link rewrites, and docs-owned gates stay authoritative.
          NXUSKIT_EXAMPLES_REPO="${GITHUB_WORKSPACE}" node scripts/sync-local-docs.mjs --examples

          git add -A
          if git diff --cached --quiet; then
            echo "No doc changes to publish."
            exit 0
          fi

          git -c user.name="nxusKit Docs Bot" \
              -c user.email="docs-bot@nxuskit.local" \
              commit -m "$COMMIT_MSG"
          git push origin main
          echo "Successfully pushed examples docs to nxus-docs."
